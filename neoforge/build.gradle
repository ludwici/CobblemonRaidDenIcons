plugins {
    id 'com.gradleup.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    modImplementation "com.cobblemon:neoforge:${rootProject.cobblemon_version}"
    modImplementation "software.bernie.geckolib:geckolib-neoforge-${rootProject.geckolib_version}"
    include(modApi "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version")
    modImplementation "curse.maven:cobblemonraiddens-1349231:${rootProject.raiddens_neoforge_file}"
    modCompileOnly "curse.maven:ftb-chunks-forge-314906:${rootProject.ftb_chunks_neoforge_file}"

    modCompileOnlyApi "info.journeymap:journeymap-api-neoforge:${rootProject.journeymap_api_version}"
    modCompileOnlyApi "xaero.map:xaeroworldmap-neoforge-${rootProject.xaero_map_version}"
    modCompileOnlyApi "xaero.minimap:xaerominimap-neoforge-${rootProject.xaero_minimap_version}"
    forgeRuntimeLibrary "thedarkcolour:kotlinforforge-neoforge:${rootProject.kotlin_for_forge_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    def props = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        neoforge_version: rootProject.neoforge_version,
        architectury_api_version: rootProject.architectury_api_version,
        cobblemon_version: rootProject.cobblemon_version
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

shadowJar {
    exclude 'architectury.common.json'
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}


publishMods {
    file = remapJar.archiveFile
    changelog = providers.fileContents(rootProject.layout.projectDirectory.file("CHANGELOG.md")).asText
    version = "${rootProject.minecraft_version}-${rootProject.mod_version}"
    displayName = remapJar.archiveFile.map { it.asFile.name }
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = providers.gradleProperty("publishDryRun").map { it.toBoolean() }.orElse(false)

    curseforge {
        projectId = "1604194"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("CURSEFORGE_TOKEN"))
        minecraftVersions.add(rootProject.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
        requires("cobblemon")
        requires("cobblemonraiddens")
        requires("architectury-api")
        optional("xaeros-minimap")
        optional("xaeros-world-map")
        optional("journeymap")
        optional("diorama")
    }

    modrinth {
        projectId = "Ou0WNFNa"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("MODRINTH_TOKEN"))
        version = rootProject.mod_version
        displayName = "Cobblemon Raid Dens Icons ${rootProject.mod_version}"
        minecraftVersions.add(rootProject.minecraft_version)
        requires("cobblemon")
        requires("cobblemonraiddens")
        requires("architectury-api")
        optional("xaeros-minimap")
        optional("xaeros-world-map")
        optional("journeymap")
        optional("diorama-map")
    }
}
