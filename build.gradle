plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'org.jetbrains.kotlin.jvm' version '2.4.0'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "New JourneyMap Maven"
		url = 'https://maven.blamejared.com'
	}
	maven { url = "https://maven.impactdev.net/repository/development/" }
	maven {
		name = 'GeckoLib'
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroup("software.bernie.geckolib")
		}
	}
	maven { url "https://maven.shedaniel.me/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:$rootProject.fabric_kotlin"

	modImplementation "com.cobblemon:fabric:$rootProject.cobblemon_version"
	modCompileOnlyApi "info.journeymap:journeymap-api-fabric:$project.journeymap_api_version"
	include(modApi "me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version")
	modImplementation "software.bernie.geckolib:geckolib-fabric-$rootProject.geckolib_version"
	modImplementation "curse.maven:cobblemonraiddens-1349231:8358837"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
